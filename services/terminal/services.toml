# Manifest of the terminal daemon. This file is the only source of truth for the
# services that the daemon starts, stops and monitors.
#
# The order of the [[service]] blocks is the start order. "Start all" follows it.
#
# Fields:
#   name        the identity of the service, unique
#   group       the group in the sidebar of the console
#   kind        "process" (a child of the daemon) or "docker" (a compose stack)
#   cwd         the working directory, relative to the root of the repository
#   cmd         the command line, as a list of arguments (kind = "process" only).
#               `{python}` becomes the interpreter of the venv at the repository root.
#   log_file    an optional log file to read instead of the output of the process
#   rebuild     an optional command that rebuilds the service
#   stale_src   an optional source directory. The console shows a "stale" badge
#               when a file in it is newer than the first item of cmd.
#   ready_tcp   an optional "host:port". The start sequence waits for the port.
#   env         an optional [service.env] table. These variables go into the
#               environment of the process, above the environment of the daemon.
#   depends_on  documentation only. The daemon does not apply it.
#   note        a free remark that the console shows on the card

[[service]]
name = "nats"
group = "Infra"
kind = "docker"
cwd = "."
depends_on = []

[[service]]
name = "datastores"
group = "Infra"
kind = "docker"
cwd = "services/hippocampe"
depends_on = []
note = "PostgreSQL and Qdrant"

[[service]]
name = "llama-server"
group = "Cognition"
kind = "process"
cwd = "."
depends_on = []
ready_tcp = "127.0.0.1:8080"
note = "Gemma-4 12B QAT with an MTP draft model."
cmd = [
  "/home/milo/.local/bin/llama-server",
  "-m", "/mnt/forge/ai/models/Gemma-4/MTP-QAT-12B/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf",
  "--model-draft", "/mnt/forge/ai/models/Gemma-4/MTP-QAT-12B/mtp-gemma-4-12B-it.gguf",
  "--mmproj", "/mnt/forge/ai/models/Gemma-4/MTP-QAT-12B/mmproj-BF16.gguf",
  "--spec-type", "draft-mtp",
  "--spec-draft-n-max", "4",
  "-c", "15000",
  "-ctk", "q8_0",
  "-ctv", "q8_0",
  "-ngl", "999",
  "--host", "127.0.0.1",
  "--port", "8080",
  "-fa", "on",
  "--parallel", "1",
  "-b", "2048",
  "-ub", "1024",
  "--temp", "1",
  "--top_p", "0.95",
  "--top_k", "64",
  "--repeat_penalty", "1.0",
  "--chat-template-file", "/mnt/forge/ai/models/Gemma-4/MTP-QAT-12B/chat_template.jinja",
  "-ngld", "999",
  "--jinja",
]

[[service]]
name = "llama-server-qwen"
group = "Cognition"
kind = "process"
cwd = "."
depends_on = []
ready_tcp = "127.0.0.1:8080"
note = "Qwen3.5 4B Q6_K with the mmproj, no thinking. Do not start it with llama-server."
cmd = [
  "/home/milo/.local/bin/llama-server",
  "-m", "/home/milo/Forge/ai/models/Qwen3.5/4B/Qwen3.5-4B-Q6_K.gguf",
  "--mmproj", "/home/milo/Forge/ai/models/Qwen3.5/4B/mmproj-BF16.gguf",
  "-ngl", "all",
  "-c", "32768",
  "-fa", "on",
  "-ctk", "q8_0",
  "-ctv", "q8_0",
  "-b", "2048",
  "-ub", "512",
  "-np", "1",
  "--reasoning", "off",
  "--chat-template-kwargs", '{"enable_thinking":false}',
  "--temp", "0.7",
  "--top-p", "0.8",
  "--top-k", "20",
  "--min-p", "0.0",
  "--presence-penalty", "1.5",
  "--repeat-penalty", "1.0",
  "--host", "127.0.0.1",
  "--port", "8080",
]

[[service]]
name = "cortex"
group = "Cognition"
kind = "process"
cwd = "services/cortex"
cmd = ["target/release/cortex"]
rebuild = ["cargo", "build", "--release"]
stale_src = "src"
depends_on = ["nats"]

[[service]]
name = "lobe_frontal"
group = "Cognition"
kind = "process"
cwd = "services/lobe_frontal"
cmd = ["{python}", "main.py"]
log_file = "lobe_frontal.log"
depends_on = ["nats", "llama-server", "hippocampe"]
note = "Textual TUI. The console reads the log file, not the screen."

[[service]]
name = "hippocampe"
group = "Cognition"
kind = "process"
cwd = "services/hippocampe"
cmd = ["{python}", "main.py"]
depends_on = ["nats", "datastores"]

[[service]]
name = "limbic"
group = "Cognition"
kind = "process"
cwd = "services/limbic"
cmd = ["{python}", "main.py"]
depends_on = ["nats"]

[[service]]
name = "io_oreilles"
group = "Entrées/sorties"
kind = "process"
cwd = "services/io_oreilles"
cmd = ["target/release/io_oreilles"]
rebuild = ["cargo", "build", "--release", "--features", "cuda"]
stale_src = "src"
depends_on = ["nats"]
note = "Local microphone."

[[service]]
name = "io_oreilles_discord"
group = "Entrées/sorties"
kind = "process"
cwd = "services/io_oreilles"
cmd = ["target/release/io_oreilles", "--discord"]
rebuild = ["cargo", "build", "--release", "--features", "cuda"]
stale_src = "src"
depends_on = ["nats", "io_discord"]
note = "Discord audio. Do not start it with io_oreilles."

[[service]]
name = "io_voix"
group = "Entrées/sorties"
kind = "process"
cwd = "services/io_voix"
cmd = ["{python}", "main.py"]
depends_on = ["nats"]
note = "Local playback on. Reference voice: Unicorn (fr-FR)."

  [service.env]
  A8_VOICE_WAV = "voices/Default - Unicorn_unselect_01_fr-FR_dubbed.mp3"
  A8_VOICE_TEXT = "Je bosse sur un nouveau numéro où j'enveloppe un spectateur de flammes éthérées. J'ai pas encore trouvé comment faire sans immoler quelqu'un, mais j'y suis presque. Sûrement..."

[[service]]
name = "io_voix_muet"
group = "Entrées/sorties"
kind = "process"
cwd = "services/io_voix"
cmd = ["{python}", "main.py"]
depends_on = ["nats"]
note = "No local playback: the audio goes to NATS only. Do not start it with io_voix."

  [service.env]
  A8_VOICE_WAV = "voices/Default - Unicorn_unselect_01_fr-FR_dubbed.mp3"
  A8_VOICE_TEXT = "Je bosse sur un nouveau numéro où j'enveloppe un spectateur de flammes éthérées. J'ai pas encore trouvé comment faire sans immoler quelqu'un, mais j'y suis presque. Sûrement..."
  MUTE_LOCAL_PLAYBACK = "1"

[[service]]
name = "io_discord"
group = "Entrées/sorties"
kind = "process"
cwd = "services/io_discord"
cmd = ["{python}", "bot.py"]
depends_on = ["nats"]

[[service]]
name = "io_text"
group = "Entrées/sorties"
kind = "process"
cwd = "services/io_text"
cmd = ["{python}", "main.py"]
depends_on = ["nats"]
note = "An interactive editor. Start it in your own terminal, not here."

[[service]]
name = "benchmark"
group = "Outillage"
kind = "process"
cwd = "services/benchmark"
cmd = ["{python}", "main.py"]
depends_on = ["nats"]

# Profiles: named subsets. The daemon starts them in the order of this file.

[profile.complet]
services = ["nats", "datastores", "llama-server", "cortex", "hippocampe", "limbic", "lobe_frontal", "io_oreilles", "io_voix"]

[profile."sans-vocal"]
services = ["nats", "datastores", "llama-server", "cortex", "hippocampe", "limbic", "lobe_frontal"]

[profile.discord]
services = ["nats", "datastores", "llama-server", "cortex", "hippocampe", "limbic", "lobe_frontal", "io_discord", "io_oreilles_discord", "io_voix_muet"]

[profile.infra]
services = ["nats", "datastores", "llama-server"]

# Text files that the Config tab of the console edits. The daemon writes no other
# path: the API names a file by `name`, never by a path from the browser.
#   service     the service that reads the file
#   hot_reload  true when the service follows the file on disk. The console then
#               offers no restart. Default false: a restart is the safe answer.

[[config_file]]
name = "PERSONA.md"
path = "services/lobe_frontal/config/PERSONA.md"
service = "lobe_frontal"
hot_reload = true
note = "Who Aletheia is: the character, the voice and the limits."

[[config_file]]
name = "MEMORY.md"
path = "services/lobe_frontal/config/MEMORY.md"
service = "lobe_frontal"
hot_reload = true
note = "The permanent knowledge, in the <core_memory> section of the prompt."

[[config_file]]
name = "USER.md"
path = "services/lobe_frontal/config/USER.md"
service = "lobe_frontal"
hot_reload = true
note = "Who speaks to her, in the <users> section of the prompt."
