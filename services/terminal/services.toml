# LFM3 1.7B with the Aletheia LoRA V2 (LLM_RESEARCH, 2026-11-15), merged and quantized to Q8_0.
# The GGUF holds the sampling of Liquid: temp 0.1, top_k 50, repeat penalty 1.1. lobe_frontal
# sends its own temperature and top_p, thus set TEMPERATURE=0.1 in services/lobe_frontal/.env.
# There is no mmproj: for the vision, start llama-server-lfm3-vl and io_yeux_lfm with it.
[[service]]
name = "llama-server-aletheia"
group = "Cognition"
kind = "process"
cwd = "."
depends_on = []
ready_tcp = "127.0.0.1:8080"
note = "LFM3 1.7B + LoRA Aletheia V2, Q8_0. Set TEMPERATURE=0.1 in the .env of lobe_frontal. Do not start it with another server on port 8080."
cmd = [
  "/home/milo/.local/bin/llama-server",
  "-m", "/mnt/forge/dev/LLM_RESEARCH/train/out/lfm3-aletheia-v2/gguf/aletheia-Q8_0.gguf",
  "-ngl", "all",
  "-c", "32768",
  "-fa", "on",
  "-np", "1",
  "--jinja",
  "--host", "127.0.0.1",
  "--port", "8080",
]

# Qwen3.5 4B with the Aletheia LoRA (LLM_RESEARCH, 2026-11-18), trained with QAT for this exact
# Q4_K_M file (llama-quantize without imatrix). Thinking stays on: lobe_frontal sends
# enable_thinking, TEMPERATURE=0.1 and TOP_P=0.95 from its .env, the values of the evals.
# No MTP draft: the MTP head of the GGUF is the one of the base model, it accepts 34 % of the
# drafted tokens only, and the first word comes later (0.80 s instead of 0.67 s).
# No mmproj: for the vision, start llama-server-lfm3-vl and io_yeux_lfm with it.
[[service]]
name = "llama-server-aletheia-qwen"
group = "Cognition"
kind = "process"
cwd = "."
depends_on = []
ready_tcp = "127.0.0.1:8080"
note = "Qwen3.5 4B + LoRA Aletheia, QAT Q4_K_M. Set TEMPERATURE=0.1 in the .env of lobe_frontal. Do not start it with another server on port 8080."
cmd = [
  "/home/milo/.local/bin/llama-server",
  "-m", "/mnt/forge/dev/LLM_RESEARCH/train/out/qwen35-aletheia/gguf/aletheia-Q4_K_M.gguf",
  "-ngl", "all",
  "-c", "32768",
  "-fa", "on",
  "-np", "1",
  "--jinja",
  "--temp", "0.1",
  "--host", "127.0.0.1",
  "--port", "8080",
]

# The same model after two DPO rounds on the SFT (LLM_RESEARCH, 2026-11-23, candidate): it keeps
# silent between humans and obeys "tais-toi" more often, calls set_mood and get_from_memory more
# often. Same Q4_K_M export without imatrix, same settings as llama-server-aletheia-qwen.
[[service]]
name = "llama-server-aletheia-qwen-dpo"
group = "Cognition"
kind = "process"
cwd = "."
depends_on = []
ready_tcp = "127.0.0.1:8080"
note = "Qwen3.5 4B + LoRA Aletheia + DPO tour 2, Q4_K_M. Set TEMPERATURE=0.1 in the .env of lobe_frontal. Do not start it with another server on port 8080."
cmd = [
  "/home/milo/.local/bin/llama-server",
  "-m", "/mnt/forge/dev/LLM_RESEARCH/train/out/dpo2/run/gguf/aletheia-dpo2-Q4_K_M.gguf",
  "-ngl", "all",
  "-c", "32768",
  "-fa", "on",
  "-np", "1",
  "--jinja",
  "--temp", "0.1",
  "--host", "127.0.0.1",
  "--port", "8080",
]

